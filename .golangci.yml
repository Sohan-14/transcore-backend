version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - errorlint
    - bodyclose
    - contextcheck
    - copyloopvar
    - nilerr
    - gocritic
    - gosec
    - revive
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
  exclusions:
    generated: lax
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
