version: "2"

sql:
  # ==================================================
  # Start: module auth
  # ==================================================
  - engine: "postgresql"
    queries: "internal/modules/auth/internal/adapters/postgres/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "internal/modules/auth/internal/adapters/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_empty_slices: true
        overrides:
          - db_type: "citext"
            go_type: "string"
  # ==================================================
  # END: module auth
  # ==================================================
  # ==================================================
